name: Build Compass Player Firmware

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compass-player-firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Compass Player Firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # ============================================================
      # MIPS TOOLCHAIN
      # ============================================================

      - name: Install repository-cached MIPS musl toolchain
        shell: bash
        run: |
          set -euo pipefail

          test -x scripts/install_mips_toolchain.sh

          toolchain_dir="$(scripts/install_mips_toolchain.sh "$RUNNER_TEMP")"

          test -d "$toolchain_dir/bin"

          echo "$toolchain_dir/bin" >> "$GITHUB_PATH"

          echo "MIPS toolchain:"
          "$toolchain_dir/bin/mipsel-linux-musl-gcc" --version | head -n 1
          "$toolchain_dir/bin/mipsel-linux-musl-g++" --version | head -n 1
          "$toolchain_dir/bin/mipsel-linux-musl-strip" --version | head -n 1

      # ============================================================
      # HOST VALIDATION TOOLS
      # ============================================================

      - name: Install validation tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install --yes --no-install-recommends \
            file \
            lua5.4 \
            zip

      # ============================================================
      # CLEAN BUILD
      # ============================================================

      - name: Clean previous build artifacts
        shell: bash
        run: |
          set -euo pipefail

          make clean || true

          rm -f compas_player_target
          rm -f compas_player_host
          rm -f open_hiby_bootloader

      # ============================================================
      # BUILD COMPASS PLAYER
      # ============================================================

      - name: Build Compass Player
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "Building Compass Player"
          echo "=============================================="

          make -j2 BOARD=r1 target

          echo
          echo "Compass Player build completed."

          test -f compas_player_target
          test -s compas_player_target

          ls -lh compas_player_target

      # ============================================================
      # BUILD HIBY R1 BOOTLOADER
      # ============================================================

      - name: Build HiBy R1 bootloader
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "Building HiBy R1 bootloader"
          echo "=============================================="

          make -j2 BOARD=r1 bootloader

          echo
          echo "Bootloader build completed."

          test -f open_hiby_bootloader
          test -s open_hiby_bootloader

          ls -lh open_hiby_bootloader

      # ============================================================
      # VERIFY COMPASS PLAYER
      # ============================================================

      - name: Verify Compass Player binary
        shell: bash
        run: |
          set -euo pipefail

          BINARY="compas_player_target"

          echo "=============================================="
          echo "Verifying Compass Player"
          echo "=============================================="

          test -f "$BINARY"
          test -s "$BINARY"

          echo
          echo "File information:"
          file "$BINARY"

          echo
          echo "ELF header:"
          mipsel-linux-musl-readelf -h "$BINARY"

          echo
          echo "Checking architecture..."

          mipsel-linux-musl-readelf -h "$BINARY" \
            | grep -E "Machine:.*MIPS" >/dev/null

          echo
          echo "Compass Player binary verification successful."

          echo
          echo "Binary:"
          ls -lh "$BINARY"

      # ============================================================
      # VERIFY BOOTLOADER
      # ============================================================

      - name: Verify bootloader binary
        shell: bash
        run: |
          set -euo pipefail

          BINARY="open_hiby_bootloader"

          echo "=============================================="
          echo "Verifying HiBy R1 bootloader"
          echo "=============================================="

          if [ ! -f "$BINARY" ]; then
            echo "ERROR: Bootloader binary was not created."
            echo
            echo "Expected:"
            echo "  $BINARY"
            echo
            echo "Current directory:"
            pwd
            echo
            echo "Root directory contents:"
            ls -lah
            echo
            echo "Build directory contents:"
            find build_target -maxdepth 2 -type f -print 2>/dev/null || true
            exit 1
          fi

          test -s "$BINARY"

          echo
          echo "File information:"
          file "$BINARY"

          echo
          echo "ELF header:"
          mipsel-linux-musl-readelf -h "$BINARY"

          echo
          echo "Checking architecture..."

          mipsel-linux-musl-readelf -h "$BINARY" \
            | grep -E "Machine:.*MIPS" >/dev/null

          echo
          echo "Bootloader binary verification successful."

          echo
          echo "Binary:"
          ls -lh "$BINARY"

      # ============================================================
      # VERIFY BOTH BINARIES TOGETHER
      # ============================================================

      - name: Verify final build outputs
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "Final build outputs"
          echo "=============================================="

          test -f compas_player_target
          test -f open_hiby_bootloader

          test -s compas_player_target
          test -s open_hiby_bootloader

          echo
          ls -lh \
            compas_player_target \
            open_hiby_bootloader

          echo
          echo "Checksums:"
          sha256sum \
            compas_player_target \
            open_hiby_bootloader

      # ============================================================
      # PACKAGE ARTIFACT
      # ============================================================

      - name: Create firmware package
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          cp compas_player_target \
            release/compas_player_target

          cp open_hiby_bootloader \
            release/open_hiby_bootloader

          sha256sum \
            release/compas_player_target \
            release/open_hiby_bootloader \
            > release/SHA256SUMS

          cat > release/BUILD_INFO.txt <<EOF
          Compass Player Firmware

          Repository: ${GITHUB_REPOSITORY}
          Commit: ${GITHUB_SHA}
          Ref: ${GITHUB_REF}
          Run: ${GITHUB_RUN_NUMBER}

          Player:
          compas_player_target

          Bootloader:
          open_hiby_bootloader
          EOF

          echo "Release package:"
          find release -maxdepth 1 -type f -print -exec ls -lh {} \;

      # ============================================================
      # UPLOAD GITHUB ACTION ARTIFACT
      # ============================================================

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compass-player-firmware-${{ github.run_number }}
          path: |
            release/compas_player_target
            release/open_hiby_bootloader
            release/SHA256SUMS
            release/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # AUTOMATIC MAIN BUILD RELEASE
      # ============================================================

      - name: Create automatic main build release
        if: ${{ github.ref == 'refs/heads/main' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"

          cat > release-notes.txt <<EOF
          Automatic Compass Player firmware build

          Commit: ${GITHUB_SHA}
          Build: ${GITHUB_RUN_NUMBER}

          Included binaries:

          - compas_player_target
          - open_hiby_bootloader

          SHA256 checksums are included in SHA256SUMS.
          EOF

          gh release create "$TAG" \
            release/compas_player_target \
            release/open_hiby_bootloader \
            release/SHA256SUMS \
            release/BUILD_INFO.txt \
            --target "$GITHUB_SHA" \
            --title "Compass Player Build ${GITHUB_RUN_NUMBER}" \
            --notes-file release-notes.txt \
            --latest

      # ============================================================
      # VERSION TAG RELEASE
      # ============================================================

      - name: Create version release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"

          cat > release-notes.txt <<EOF
          Compass Player Firmware ${TAG}

          Commit: ${GITHUB_SHA}

          Included binaries:

          - compas_player_target
          - open_hiby_bootloader

          SHA256 checksums are included in SHA256SUMS.
          EOF

          gh release create "$TAG" \
            release/compas_player_target \
            release/open_hiby_bootloader \
            release/SHA256SUMS \
            release/BUILD_INFO.txt \
            --verify-tag \
            --title "Compass Player Firmware ${TAG}" \
            --notes-file release-notes.txt \
            --latest
