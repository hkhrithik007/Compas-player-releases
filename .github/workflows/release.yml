name: Build HiBy R1 Firmware

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build HiBy R1 Firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # DEPENDENCIES
      # ============================================================
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install --yes --no-install-recommends \
            ca-certificates \
            curl \
            file \
            gzip \
            make \
            tar \
            zip \
            lua5.4

      # ============================================================
      # MIPS MUSL TOOLCHAIN CACHE
      #
      # IMPORTANT:
      # We do NOT call scripts/install_mips_toolchain.sh here.
      #
      # That script is what was trying to connect to musl.cc.
      # ============================================================
      - name: Restore MIPS musl toolchain cache
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: .toolchains/mipsel-linux-musl-cross
          key: mipsel-musl-toolchain-2025-06-12-${{ runner.os }}-v1

      # ============================================================
      # DOWNLOAD MIPS MUSL TOOLCHAIN
      # ============================================================
      - name: Install MIPS musl toolchain
        shell: bash
        run: |
          set -euo pipefail

          TOOLCHAIN_ROOT="$GITHUB_WORKSPACE/.toolchains"
          TOOLCHAIN_DIR="$TOOLCHAIN_ROOT/mipsel-linux-musl-cross"

          mkdir -p "$TOOLCHAIN_ROOT"

          echo "============================================================"
          echo "MIPS musl toolchain"
          echo "============================================================"
          echo "Directory:"
          echo "$TOOLCHAIN_DIR"
          echo

          # --------------------------------------------------------
          # Check whether the Actions cache already restored it.
          # --------------------------------------------------------
          if [[ -x "$TOOLCHAIN_DIR/bin/mipsel-linux-musl-gcc" ]]; then
            echo "Toolchain cache hit."
            echo "Using cached toolchain."
          else
            echo "Toolchain cache miss."
            echo "Downloading GitHub-hosted MIPS musl toolchain..."

            ARCHIVE="$RUNNER_TEMP/mipsel-linux-musl-cross.tgz"

            TOOLCHAIN_URL="https://github.com/OpenListTeam/musl-compilers/releases/download/2025-06-12/mipsel-linux-musl-cross.tgz"

            echo
            echo "Downloading:"
            echo "$TOOLCHAIN_URL"
            echo

            rm -f "$ARCHIVE"

            curl \
              --fail \
              --location \
              --show-error \
              --retry 5 \
              --retry-delay 5 \
              --retry-all-errors \
              --connect-timeout 20 \
              --max-time 600 \
              --output "$ARCHIVE" \
              "$TOOLCHAIN_URL"

            echo
            echo "Download completed."

            test -s "$ARCHIVE"

            echo "Checking gzip archive..."

            gzip -t "$ARCHIVE"

            echo "Archive is valid."

            # ------------------------------------------------------
            # Extract into temporary directory first.
            # ------------------------------------------------------
            TEMP_EXTRACT="$RUNNER_TEMP/mipsel-toolchain-extract"

            rm -rf "$TEMP_EXTRACT"
            mkdir -p "$TEMP_EXTRACT"

            echo
            echo "Extracting toolchain..."

            tar \
              -xzf "$ARCHIVE" \
              -C "$TEMP_EXTRACT" \
              --strip-components=1

            # ------------------------------------------------------
            # Replace old incomplete toolchain if one exists.
            # ------------------------------------------------------
            rm -rf "$TOOLCHAIN_DIR"
            mkdir -p "$TOOLCHAIN_DIR"

            cp -a "$TEMP_EXTRACT"/. "$TOOLCHAIN_DIR"/

            rm -rf "$TEMP_EXTRACT"
            rm -f "$ARCHIVE"

            echo "Toolchain extracted."
          fi

          # ========================================================
          # NORMALISE / VERIFY TOOLCHAIN
          # ========================================================

          echo
          echo "Checking toolchain layout..."

          if [[ ! -d "$TOOLCHAIN_DIR/bin" ]]; then
            echo "ERROR: Toolchain bin directory does not exist:"
            echo "$TOOLCHAIN_DIR/bin"
            echo
            echo "Toolchain contents:"
            find "$TOOLCHAIN_DIR" -maxdepth 3 -type f | head -100 || true
            exit 1
          fi

          REQUIRED_BINARIES=(
            mipsel-linux-musl-gcc
            mipsel-linux-musl-g++
            mipsel-linux-musl-strip
            mipsel-linux-musl-readelf
          )

          echo
          echo "Checking required MIPS binaries..."

          for binary in "${REQUIRED_BINARIES[@]}"; do
            if [[ ! -x "$TOOLCHAIN_DIR/bin/$binary" ]]; then
              echo "ERROR: Missing toolchain binary:"
              echo "$TOOLCHAIN_DIR/bin/$binary"
              exit 1
            fi

            echo "OK: $binary"
          done

          # --------------------------------------------------------
          # Add toolchain to PATH for all following workflow steps.
          # --------------------------------------------------------
          echo "$TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"

          echo
          echo "MIPS toolchain installed successfully."

      # ============================================================
      # VERIFY MIPS TOOLCHAIN
      # ============================================================
      - name: Verify MIPS toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "MIPS GCC"
          echo "============================================================"

          command -v mipsel-linux-musl-gcc
          mipsel-linux-musl-gcc --version | head -n 2

          echo
          echo "============================================================"
          echo "MIPS G++"
          echo "============================================================"

          command -v mipsel-linux-musl-g++
          mipsel-linux-musl-g++ --version | head -n 2

          echo
          echo "============================================================"
          echo "MIPS STRIP"
          echo "============================================================"

          command -v mipsel-linux-musl-strip
          mipsel-linux-musl-strip --version | head -n 2

          echo
          echo "============================================================"
          echo "MIPS READELF"
          echo "============================================================"

          command -v mipsel-linux-musl-readelf
          mipsel-linux-musl-readelf --version | head -n 2

          echo
          echo "============================================================"
          echo "TARGET TRIPLE"
          echo "============================================================"

          mipsel-linux-musl-gcc -dumpmachine

          if [[ "$(mipsel-linux-musl-gcc -dumpmachine)" != "mipsel-linux-musl" ]]; then
            echo "ERROR: Wrong compiler target."
            exit 1
          fi

          echo
          echo "MIPS musl toolchain verification successful."

      # ============================================================
      # CLEAN BUILD
      # ============================================================
      - name: Clean build
        shell: bash
        run: |
          set -euo pipefail

          make clean || true

      # ============================================================
      # BUILD PLAYER
      # ============================================================
      - name: Build HiBy R1 player
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Building HiBy R1 player"
          echo "============================================================"

          make -j2 target

      # ============================================================
      # BUILD BOOTLOADER
      # ============================================================
      - name: Build HiBy R1 bootloader
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Building HiBy R1 bootloader"
          echo "============================================================"

          make -j2 bootloader

      # ============================================================
      # BOOTLOADER SELF TEST
      # ============================================================
      - name: Run bootloader player selection self-test
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Bootloader player selection self-test"
          echo "============================================================"

          make bootloader-player-selftest

      # ============================================================
      # VERIFY PLAYER
      # ============================================================
      - name: Verify player binary
        shell: bash
        run: |
          set -euo pipefail

          BINARY="open_hiby_player_target"

          echo "============================================================"
          echo "Verifying player binary"
          echo "============================================================"

          if [[ ! -f "$BINARY" ]]; then
            echo "ERROR: Player binary was not created."
            echo "Expected:"
            echo "  $BINARY"
            exit 1
          fi

          if [[ ! -x "$BINARY" ]]; then
            echo "ERROR: Player binary is not executable."
            exit 1
          fi

          echo
          echo "File:"
          ls -lh "$BINARY"

          echo
          echo "file:"
          file "$BINARY"

          echo
          echo "ELF header:"
          mipsel-linux-musl-readelf -h "$BINARY"

          echo
          echo "Architecture check:"

          mipsel-linux-musl-readelf -h "$BINARY" |
            grep -E 'Class:|Data:|Machine:.*MIPS'

          echo
          echo "Player binary verification successful."

      # ============================================================
      # VERIFY BOOTLOADER
      # ============================================================
      - name: Verify bootloader binary
        shell: bash
        run: |
          set -euo pipefail

          BINARY="open_hiby_bootloader"

          echo "============================================================"
          echo "Verifying bootloader binary"
          echo "============================================================"

          if [[ ! -f "$BINARY" ]]; then
            echo "ERROR: Bootloader binary was not created."
            echo "Expected:"
            echo "  $BINARY"
            exit 1
          fi

          if [[ ! -x "$BINARY" ]]; then
            echo "ERROR: Bootloader binary is not executable."
            exit 1
          fi

          echo
          echo "File:"
          ls -lh "$BINARY"

          echo
          echo "file:"
          file "$BINARY"

          echo
          echo "ELF header:"
          mipsel-linux-musl-readelf -h "$BINARY"

          echo
          echo "Architecture check:"

          mipsel-linux-musl-readelf -h "$BINARY" |
            grep -E 'Class:|Data:|Machine:.*MIPS'

          echo
          echo "Bootloader verification successful."

      # ============================================================
      # PACKAGE
      # ============================================================
      - name: Package firmware binaries
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Packaging HiBy R1 binaries"
          echo "============================================================"

          rm -rf release
          mkdir -p release

          cp -f \
            open_hiby_player_target \
            release/open_hiby_player_target

          cp -f \
            open_hiby_bootloader \
            release/open_hiby_bootloader

          chmod +x \
            release/open_hiby_player_target \
            release/open_hiby_bootloader

          (
            cd release

            sha256sum \
              open_hiby_player_target \
              open_hiby_bootloader \
              > SHA256SUMS
          )

          zip -9 \
            hiby-r1-firmware-binaries.zip \
            release/open_hiby_player_target \
            release/open_hiby_bootloader \
            release/SHA256SUMS

          echo
          echo "============================================================"
          echo "Release files"
          echo "============================================================"

          ls -lh \
            open_hiby_player_target \
            open_hiby_bootloader \
            hiby-r1-firmware-binaries.zip \
            release/SHA256SUMS

          echo
          echo "SHA256SUMS:"
          cat release/SHA256SUMS

      # ============================================================
      # GITHUB ACTIONS ARTIFACT
      # ============================================================
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hiby-r1-firmware-${{ github.sha }}
          if-no-files-found: error
          path: |
            open_hiby_player_target
            open_hiby_bootloader
            hiby-r1-firmware-binaries.zip
            release/SHA256SUMS

      # ============================================================
      # MAIN BRANCH RELEASE
      # ============================================================
      - name: Create main branch release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"

          echo "Creating release:"
          echo "$TAG"

          gh release create "$TAG" \
            open_hiby_player_target \
            open_hiby_bootloader \
            hiby-r1-firmware-binaries.zip \
            release/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "Latest Build" \
            --notes "Automatic HiBy R1 firmware build from ${GITHUB_SHA}." \
            --latest

      # ============================================================
      # VERSION TAG RELEASE
      # ============================================================
      - name: Create version release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"

          echo "Creating release:"
          echo "$TAG"

          gh release create "$TAG" \
            open_hiby_player_target \
            open_hiby_bootloader \
            hiby-r1-firmware-binaries.zip \
            release/SHA256SUMS \
            --verify-tag \
            --title "HiBy R1 Player ${TAG}" \
            --notes "HiBy R1 firmware build ${TAG}." \
            --latest
