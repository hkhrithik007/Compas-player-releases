name: Build Compass Player Firmware

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Compass Player Firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ============================================================
      # BUILD DEPENDENCIES
      # ============================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install --yes --no-install-recommends \
            ca-certificates \
            curl \
            file \
            gcc \
            g++ \
            git \
            gzip \
            make \
            patch \
            python3 \
            tar \
            zip \
            lua5.4


      # ============================================================
      # MIPS MUSL TOOLCHAIN CACHE
      # ============================================================

      - name: Restore MIPS musl toolchain cache
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: .toolchains/mipsel-linux-musl-cross
          key: mipsel-musl-toolchain-2025-06-12-${{ runner.os }}-v1


      # ============================================================
      # INSTALL MIPS MUSL TOOLCHAIN
      # ============================================================

      - name: Install MIPS musl toolchain
        shell: bash
        run: |
          set -euo pipefail

          TOOLCHAIN_ROOT="$GITHUB_WORKSPACE/.toolchains"
          TOOLCHAIN_DIR="$TOOLCHAIN_ROOT/mipsel-linux-musl-cross"

          mkdir -p "$TOOLCHAIN_ROOT"

          echo "============================================================"
          echo "MIPS musl toolchain"
          echo "============================================================"

          echo "Toolchain directory:"
          echo "$TOOLCHAIN_DIR"

          if [[ -x "$TOOLCHAIN_DIR/bin/mipsel-linux-musl-gcc" ]]; then

            echo
            echo "Toolchain cache hit."
            echo "Using cached MIPS musl toolchain."

          else

            echo
            echo "Toolchain cache miss."
            echo "Downloading MIPS musl toolchain..."

            ARCHIVE="$RUNNER_TEMP/mipsel-linux-musl-cross.tgz"

            TOOLCHAIN_URL="https://github.com/OpenListTeam/musl-compilers/releases/download/2025-06-12/mipsel-linux-musl-cross.tgz"

            echo
            echo "Download URL:"
            echo "$TOOLCHAIN_URL"

            rm -f "$ARCHIVE"

            curl \
              --fail \
              --location \
              --show-error \
              --retry 5 \
              --retry-delay 5 \
              --retry-all-errors \
              --connect-timeout 20 \
              --max-time 600 \
              --output "$ARCHIVE" \
              "$TOOLCHAIN_URL"

            test -s "$ARCHIVE"

            echo
            echo "Checking archive integrity..."

            gzip -t "$ARCHIVE"

            echo "Archive integrity OK."

            TEMP_EXTRACT="$RUNNER_TEMP/mipsel-toolchain-extract"

            rm -rf "$TEMP_EXTRACT"
            mkdir -p "$TEMP_EXTRACT"

            echo
            echo "Extracting toolchain..."

            tar \
              -xzf "$ARCHIVE" \
              -C "$TEMP_EXTRACT" \
              --strip-components=1

            rm -rf "$TOOLCHAIN_DIR"

            mkdir -p "$TOOLCHAIN_DIR"

            cp -a "$TEMP_EXTRACT"/. "$TOOLCHAIN_DIR"/

            rm -rf "$TEMP_EXTRACT"
            rm -f "$ARCHIVE"

            echo "Toolchain extracted."

          fi


          # ========================================================
          # VERIFY TOOLCHAIN STRUCTURE
          # ========================================================

          if [[ ! -d "$TOOLCHAIN_DIR/bin" ]]; then
            echo "ERROR: Toolchain bin directory does not exist:"
            echo "$TOOLCHAIN_DIR/bin"

            echo
            echo "Toolchain contents:"

            find "$TOOLCHAIN_DIR" \
              -maxdepth 3 \
              -type f \
              | head -100 || true

            exit 1
          fi


          # ========================================================
          # REQUIRED MIPS BINARIES
          # ========================================================

          REQUIRED_BINARIES=(
            mipsel-linux-musl-gcc
            mipsel-linux-musl-g++
            mipsel-linux-musl-strip
            mipsel-linux-musl-readelf
          )

          echo
          echo "Checking required MIPS binaries..."

          for binary in "${REQUIRED_BINARIES[@]}"; do

            if [[ ! -x "$TOOLCHAIN_DIR/bin/$binary" ]]; then
              echo "ERROR: Missing toolchain binary:"
              echo "$TOOLCHAIN_DIR/bin/$binary"
              exit 1
            fi

            echo "OK: $binary"

          done


          # ========================================================
          # ADD TOOLCHAIN TO PATH
          # ========================================================

          echo "$TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"

          echo
          echo "MIPS musl toolchain installed successfully."


      # ============================================================
      # VERIFY MIPS TOOLCHAIN
      # ============================================================

      - name: Verify MIPS toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "MIPS GCC"
          echo "============================================================"

          command -v mipsel-linux-musl-gcc
          mipsel-linux-musl-gcc --version | head -n 2


          echo
          echo "============================================================"
          echo "MIPS G++"
          echo "============================================================"

          command -v mipsel-linux-musl-g++
          mipsel-linux-musl-g++ --version | head -n 2


          echo
          echo "============================================================"
          echo "MIPS STRIP"
          echo "============================================================"

          command -v mipsel-linux-musl-strip
          mipsel-linux-musl-strip --version | head -n 2


          echo
          echo "============================================================"
          echo "MIPS READELF"
          echo "============================================================"

          command -v mipsel-linux-musl-readelf
          mipsel-linux-musl-readelf --version | head -n 2


          echo
          echo "============================================================"
          echo "TARGET TRIPLE"
          echo "============================================================"

          TARGET_TRIPLE="$(mipsel-linux-musl-gcc -dumpmachine)"

          echo "$TARGET_TRIPLE"

          if [[ "$TARGET_TRIPLE" != "mipsel-linux-musl" ]]; then
            echo "ERROR: Wrong compiler target."
            exit 1
          fi

          echo
          echo "MIPS musl toolchain verification successful."


      # ============================================================
      # CLEAN BUILD
      # ============================================================

      - name: Clean build
        shell: bash
        run: |
          set -euo pipefail

          make clean || true


      # ============================================================
      # BUILD COMPASS PLAYER
      #
      # Makefile:
      #   BOARD ?= r1
      #   TARGET_BIN = compas_player_target
      #
      # Explicitly use BOARD=r1 so CI cannot accidentally build
      # another board in the future.
      # ============================================================

      - name: Build Compass Player
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Building Compass Player"
          echo "============================================================"

          make -j2 BOARD=r1 target


      # ============================================================
      # BUILD HIBY R1 BOOTLOADER
      # ============================================================

      - name: Build HiBy R1 bootloader
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Building HiBy R1 bootloader"
          echo "============================================================"

          make -j2 BOARD=r1 bootloader


      # ============================================================
      # VERIFY COMPASS PLAYER
      # ============================================================

      - name: Verify Compass Player binary
        shell: bash
        run: |
          set -euo pipefail

          BINARY="compas_player_target"

          echo "============================================================"
          echo "Verifying Compass Player binary"
          echo "============================================================"

          if [[ ! -f "$BINARY" ]]; then
            echo "ERROR: Compass Player binary was not created."
            echo
            echo "Expected:"
            echo "  $BINARY"
            echo
            echo "Files in repository root:"
            find . -maxdepth 2 -type f \
              \( -name 'compas_player*' -o -name 'open_hiby*' \) \
              -print || true

            exit 1
          fi


          if [[ ! -x "$BINARY" ]]; then
            echo "ERROR: Compass Player binary is not executable."
            exit 1
          fi


          echo
          echo "File:"
          ls -lh "$BINARY"


          echo
          echo "file:"
          file "$BINARY"


          echo
          echo "ELF header:"

          mipsel-linux-musl-readelf -h "$BINARY"


          echo
          echo "Architecture check:"

          mipsel-linux-musl-readelf -h "$BINARY" |
            grep -E 'Class:|Data:|Machine:.*MIPS'


          echo
          echo "Compass Player binary verification successful."


      # ============================================================
      # VERIFY BOOTLOADER
      # ============================================================

      - name: Verify bootloader binary
        shell: bash
        run: |
          set -euo pipefail

          BINARY="open_hiby_bootloader"

          echo "============================================================"
          echo "Verifying HiBy R1 bootloader"
          echo "============================================================"

          if [[ ! -f "$BINARY" ]]; then
            echo "ERROR: Bootloader binary was not created."

            echo
            echo "Expected:"
            echo "  $BINARY"

            exit 1
          fi


          if [[ ! -x "$BINARY" ]]; then
            echo "ERROR: Bootloader binary is not executable."
            exit 1
          fi


          echo
          echo "File:"
          ls -lh "$BINARY"


          echo
          echo "file:"
          file "$BINARY"


          echo
          echo "ELF header:"

          mipsel-linux-musl-readelf -h "$BINARY"


          echo
          echo "Architecture check:"

          mipsel-linux-musl-readelf -h "$BINARY" |
            grep -E 'Class:|Data:|Machine:.*MIPS'


          echo
          echo "Bootloader verification successful."


      # ============================================================
      # PACKAGE FIRMWARE BINARIES
      # ============================================================

      - name: Package firmware binaries
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "Packaging Compass Player firmware"
          echo "============================================================"

          rm -rf release
          mkdir -p release


          # Compass Player
          cp -f \
            compas_player_target \
            release/compas_player_target


          # HiBy R1 bootloader
          cp -f \
            open_hiby_bootloader \
            release/open_hiby_bootloader


          chmod +x \
            release/compas_player_target \
            release/open_hiby_bootloader


          (
            cd release

            sha256sum \
              compas_player_target \
              open_hiby_bootloader \
              > SHA256SUMS
          )


          zip -9 \
            hiby-r1-compass-player-binaries.zip \
            release/compas_player_target \
            release/open_hiby_bootloader \
            release/SHA256SUMS


          echo
          echo "============================================================"
          echo "Release files"
          echo "============================================================"

          ls -lh \
            compas_player_target \
            open_hiby_bootloader \
            hiby-r1-compass-player-binaries.zip \
            release/SHA256SUMS


          echo
          echo "SHA256SUMS:"
          cat release/SHA256SUMS


      # ============================================================
      # UPLOAD GITHUB ACTIONS ARTIFACT
      # ============================================================

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hiby-r1-compass-player-${{ github.sha }}
          if-no-files-found: error
          path: |
            compas_player_target
            open_hiby_bootloader
            hiby-r1-compass-player-binaries.zip
            release/SHA256SUMS


      # ============================================================
      # MAIN BRANCH RELEASE
      # ============================================================

      - name: Create main branch release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"

          echo "Creating release:"
          echo "$TAG"


          gh release create "$TAG" \
            compas_player_target \
            open_hiby_bootloader \
            hiby-r1-compass-player-binaries.zip \
            release/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "Compass Player Latest Build" \
            --notes "Automatic Compass Player firmware build from ${GITHUB_SHA}." \
            --latest


      # ============================================================
      # VERSION TAG RELEASE
      # ============================================================

      - name: Create version release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"

          echo "Creating release:"
          echo "$TAG"


          gh release create "$TAG" \
            compas_player_target \
            open_hiby_bootloader \
            hiby-r1-compass-player-binaries.zip \
            release/SHA256SUMS \
            --verify-tag \
            --title "Compass Player ${TAG}" \
            --notes "Compass Player firmware build ${TAG}." \
            --latest
