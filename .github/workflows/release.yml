name: Build Compass Player Firmware

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compass-player-firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Compass Player
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # ============================================================
      # INSTALL MIPS TOOLCHAIN
      # ============================================================

      - name: Install MIPS musl toolchain
        shell: bash
        run: |
          set -euo pipefail

          test -x scripts/install_mips_toolchain.sh

          toolchain_dir="$(scripts/install_mips_toolchain.sh "$RUNNER_TEMP")"

          test -d "$toolchain_dir/bin"

          echo "$toolchain_dir/bin" >> "$GITHUB_PATH"

          echo "Toolchain installed:"
          "$toolchain_dir/bin/mipsel-linux-musl-gcc" --version | head -n 1
          "$toolchain_dir/bin/mipsel-linux-musl-g++" --version | head -n 1

      # ============================================================
      # INSTALL VALIDATION TOOLS
      # ============================================================

      - name: Install validation tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            file \
            lua5.4 \
            zip

      # ============================================================
      # CLEAN BUILD
      # ============================================================

      - name: Clean build
        shell: bash
        run: |
          set -euo pipefail

          make clean || true

          rm -f compas_player_target
          rm -f compas_bootloader
          rm -f open_hiby_bootloader

      # ============================================================
      # BUILD PLAYER
      # ============================================================

      - name: Build Compass Player
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Building Compass Player"
          echo "=========================================="

          make -j2 BOARD=r1 target

          echo
          echo "Player build completed."

          test -f compas_player_target
          test -s compas_player_target

          ls -lh compas_player_target

      # ============================================================
      # BUILD BOOTLOADER
      # ============================================================

      - name: Build HiBy R1 bootloader
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Building HiBy R1 bootloader"
          echo "=========================================="

          make -j2 BOARD=r1 bootloader

          echo
          echo "Bootloader build completed."

          # IMPORTANT:
          # The current Makefile generates compas_bootloader.
          test -f compas_bootloader
          test -s compas_bootloader

          ls -lh compas_bootloader

      # ============================================================
      # VERIFY PLAYER
      # ============================================================

      - name: Verify Compass Player
        shell: bash
        run: |
          set -euo pipefail

          BINARY="compas_player_target"

          echo "=========================================="
          echo "Verifying Compass Player"
          echo "=========================================="

          test -f "$BINARY"
          test -s "$BINARY"

          file "$BINARY"

          mipsel-linux-musl-readelf -h "$BINARY" \
            | grep -E "Machine:.*MIPS" >/dev/null

          echo
          echo "Compass Player verification successful."

          ls -lh "$BINARY"

      # ============================================================
      # VERIFY BOOTLOADER
      # ============================================================

      - name: Verify bootloader
        shell: bash
        run: |
          set -euo pipefail

          BINARY="compas_bootloader"

          echo "=========================================="
          echo "Verifying HiBy R1 bootloader"
          echo "=========================================="

          test -f "$BINARY"
          test -s "$BINARY"

          file "$BINARY"

          mipsel-linux-musl-readelf -h "$BINARY" \
            | grep -E "Machine:.*MIPS" >/dev/null

          echo
          echo "Bootloader verification successful."

          ls -lh "$BINARY"

      # ============================================================
      # FINAL VALIDATION
      # ============================================================

      - name: Validate final binaries
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Final binaries"
          echo "=========================================="

          test -s compas_player_target
          test -s compas_bootloader

          echo
          echo "Player:"
          ls -lh compas_player_target

          echo
          echo "Bootloader:"
          ls -lh compas_bootloader

          echo
          echo "SHA256:"
          sha256sum \
            compas_player_target \
            compas_bootloader

      # ============================================================
      # PACKAGE
      # ============================================================

      - name: Package firmware
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release
          mkdir -p release

          cp compas_player_target \
            release/compas_player_target

          cp compas_bootloader \
            release/compas_bootloader

          sha256sum \
            release/compas_player_target \
            release/compas_bootloader \
            > release/SHA256SUMS

          cat > release/BUILD_INFO.txt <<EOF
          Compass Player Firmware

          Repository: ${GITHUB_REPOSITORY}
          Commit: ${GITHUB_SHA}
          Ref: ${GITHUB_REF}
          Run: ${GITHUB_RUN_NUMBER}

          Player:
          compas_player_target

          Bootloader:
          compas_bootloader
          EOF

          echo
          echo "Release package:"
          find release -maxdepth 1 -type f -print

      # ============================================================
      # GITHUB ACTION ARTIFACT
      # ============================================================

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: compass-player-firmware-${{ github.run_number }}
          path: |
            release/compas_player_target
            release/compas_bootloader
            release/SHA256SUMS
            release/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # MAIN BRANCH RELEASE
      # ============================================================

      - name: Create main build release
        if: ${{ github.ref == 'refs/heads/main' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"

          cat > release-notes.txt <<EOF
          Automatic Compass Player firmware build

          Commit: ${GITHUB_SHA}
          Build: ${GITHUB_RUN_NUMBER}

          Included:

          - compas_player_target
          - compas_bootloader
          - SHA256SUMS
          - BUILD_INFO.txt
          EOF

          gh release create "$TAG" \
            release/compas_player_target \
            release/compas_bootloader \
            release/SHA256SUMS \
            release/BUILD_INFO.txt \
            --target "$GITHUB_SHA" \
            --title "Compass Player Build ${GITHUB_RUN_NUMBER}" \
            --notes-file release-notes.txt \
            --latest

      # ============================================================
      # VERSION TAG RELEASE
      # ============================================================

      - name: Create version release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"

          cat > release-notes.txt <<EOF
          Compass Player Firmware ${TAG}

          Commit: ${GITHUB_SHA}

          Included:

          - compas_player_target
          - compas_bootloader
          - SHA256SUMS
          - BUILD_INFO.txt
          EOF

          gh release create "$TAG" \
            release/compas_player_target \
            release/compas_bootloader \
            release/SHA256SUMS \
            release/BUILD_INFO.txt \
            --verify-tag \
            --title "Compass Player Firmware ${TAG}" \
            --notes-file release-notes.txt \
            --latest
