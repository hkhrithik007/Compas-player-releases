
name: Build Compass Player Firmware

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compass-player-firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Compass Player
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # ============================================================
      # INSTALL MIPS TOOLCHAIN
      # ============================================================

      - name: Install MIPS musl toolchain
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -x scripts/install_mips_toolchain.sh ]]; then
            echo "::error::Missing scripts/install_mips_toolchain.sh"
            exit 1
          fi

          toolchain_dir="$(scripts/install_mips_toolchain.sh "$RUNNER_TEMP")"

          if [[ ! -x "$toolchain_dir/bin/mipsel-linux-musl-gcc" ]]; then
            echo "::error::MIPS GCC was not installed correctly"
            exit 1
          fi

          if [[ ! -x "$toolchain_dir/bin/mipsel-linux-musl-g++" ]]; then
            echo "::error::MIPS G++ was not installed correctly"
            exit 1
          fi

          echo "$toolchain_dir/bin" >> "$GITHUB_PATH"

          echo "Toolchain installed:"
          "$toolchain_dir/bin/mipsel-linux-musl-gcc" --version
          "$toolchain_dir/bin/mipsel-linux-musl-g++" --version

      # ============================================================
      # INSTALL VALIDATION TOOLS
      # ============================================================

      - name: Install validation tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            file \
            lua5.4 \
            zip

      # ============================================================
      # CLEAN BUILD OUTPUTS
      # ============================================================

      - name: Clean build
        shell: bash
        run: |
          set -euo pipefail

          make clean || true

          rm -f compas_player_target
          rm -f compas_loader
          rm -f compas_loader.tmp
          rm -f compas_bootloader
          rm -f open_hiby_bootloader

          # Remove the previous combined R1 image so that
          # verification cannot accidentally pass on a stale file.
          rm -f build/rockbox-bootloader/r1/compas_rockbox_bootloader

          rm -rf release

          echo "Build outputs cleaned."

      # ============================================================
      # BUILD PLAYER
      # ============================================================

      - name: Build Compass Player
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Building Compass Player for HiBy R1"
          echo "=========================================="

          make -j2 BOARD=r1 target

          if [[ ! -s compas_player_target ]]; then
            echo "::error::compas_player_target was not generated."
            ls -lah
            exit 1
          fi

          echo "Player build completed."
          ls -lh compas_player_target

      # ============================================================
      # BUILD BOOTLOADER
      # ============================================================

      - name: Build HiBy R1 bootloader
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Building HiBy R1 combined bootloader"
          echo "=========================================="

          make -j2 BOARD=r1 bootloader

          echo
          echo "Bootloader build command completed."

          # The repository Makefile generates compas_loader.
          if [[ ! -s compas_loader ]]; then
            echo "::error::Expected compas_loader was not generated."

            echo
            echo "Repository root:"
            pwd
            ls -lah

            echo
            echo "Generated bootloader files:"
            find build/rockbox-bootloader/r1 \
              -maxdepth 3 \
              -type f \
              -print 2>/dev/null || true

            exit 1
          fi

          echo
          echo "Bootloader output verified:"
          file compas_loader
          ls -lh compas_loader

      # ============================================================
      # VERIFY PLAYER
      # ============================================================

      - name: Verify Compass Player
        shell: bash
        run: |
          set -euo pipefail

          BINARY="compas_player_target"

          echo "=========================================="
          echo "Verifying Compass Player"
          echo "=========================================="

          test -s "$BINARY"

          file "$BINARY"

          mipsel-linux-musl-readelf -h "$BINARY" \
            | grep -E "Machine:.*MIPS" >/dev/null

          echo "Compass Player verification successful."
          ls -lh "$BINARY"

      # ============================================================
      # VERIFY BOOTLOADER
      # ============================================================

      - name: Verify HiBy R1 bootloader
        shell: bash
        run: |
          set -euo pipefail

          BINARY="compas_loader"

          echo "=========================================="
          echo "Verifying HiBy R1 bootloader"
          echo "=========================================="

          test -s "$BINARY"

          file "$BINARY"

          mipsel-linux-musl-readelf -h "$BINARY" \
            | grep -E "Machine:.*MIPS" >/dev/null

          echo "HiBy R1 bootloader verification successful."
          ls -lh "$BINARY"

      # ============================================================
      # FINAL VALIDATION
      # ============================================================

      - name: Validate final binaries
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Final binary validation"
          echo "=========================================="

          test -s compas_player_target
          test -s compas_loader

          echo
          echo "Player:"
          ls -lh compas_player_target

          echo
          echo "Bootloader:"
          ls -lh compas_loader

          echo
          echo "SHA256:"
          sha256sum \
            compas_player_target \
            compas_loader

      # ============================================================
      # PACKAGE
      # ============================================================

      - name: Package firmware binaries
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release
          mkdir -p release

          cp compas_player_target \
            release/compas_player_target

          cp compas_loader \
            release/compas_loader

          (
            cd release
            sha256sum \
              compas_player_target \
              compas_loader \
              > SHA256SUMS
          )

          cat > release/BUILD_INFO.txt <<EOF
          Compass Player Firmware

          Repository: ${GITHUB_REPOSITORY}
          Commit: ${GITHUB_SHA}
          Ref: ${GITHUB_REF}
          Run: ${GITHUB_RUN_NUMBER}

          Player:
          compas_player_target

          Bootloader:
          compas_loader
          EOF

          echo "Package contents:"
          find release -maxdepth 1 -type f -print

          echo
          echo "Checksums:"
          cat release/SHA256SUMS

      # ============================================================
      # UPLOAD GITHUB ACTIONS ARTIFACT
      # ============================================================

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: compass-player-firmware-${{ github.run_number }}
          path: release/
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # CREATE MAIN BRANCH RELEASE
      # ============================================================

      - name: Create main build release
        if: ${{ github.ref == 'refs/heads/main' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"

          cat > release-notes.txt <<EOF
          Automatic Compass Player firmware build.

          Commit: ${GITHUB_SHA}
          Build: ${GITHUB_RUN_NUMBER}

          Included assets:

          - compas_player_target
          - compas_loader
          - SHA256SUMS
          - BUILD_INFO.txt
          EOF

          ASSETS=(
            release/compas_player_target
            release/compas_loader
            release/SHA256SUMS
            release/BUILD_INFO.txt
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; updating its assets."

            gh release upload "$TAG" \
              "${ASSETS[@]}" \
              --clobber
          else
            gh release create "$TAG" \
              "${ASSETS[@]}" \
              --target "$GITHUB_SHA" \
              --title "Compass Player Build ${GITHUB_RUN_NUMBER}" \
              --notes-file release-notes.txt \
              --latest
          fi

      # ============================================================
      # CREATE VERSION TAG RELEASE
      # ============================================================

      - name: Create version release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"

          cat > release-notes.txt <<EOF
          Compass Player Firmware ${TAG}

          Commit: ${GITHUB_SHA}

          Included assets:

          - compas_player_target
          - compas_loader
          - SHA256SUMS
          - BUILD_INFO.txt
          EOF

          ASSETS=(
            release/compas_player_target
            release/compas_loader
            release/SHA256SUMS
            release/BUILD_INFO.txt
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; updating its assets."

            gh release upload "$TAG" \
              "${ASSETS[@]}" \
              --clobber
          else
            gh release create "$TAG" \
              "${ASSETS[@]}" \
              --verify-tag \
              --title "Compass Player Firmware ${TAG}" \
              --notes-file release-notes.txt \
              --latest
          fi
